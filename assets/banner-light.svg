<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="536" viewBox="0 0 1280 536" role="img" aria-label="Gamaleldin Salem, Full-Stack .NET Engineer. I build AI-integrated financial systems on ASP.NET Core and Angular. Capabilities: backend, frontend, data, AI and ML.">
  <!--
    Light-theme twin of banner-dark.svg. Same geometry, palette and SMIL
    boot-sequence animation — taken from the portfolio site's light tokens
    so the two stay in step.
  -->
  <defs>
    <pattern id="gridL" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 L0 0 0 56" fill="none" stroke="#d7e0ec" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f7f9fc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glowL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="536" fill="#f7f9fc"/>
  <rect width="1280" height="536" fill="url(#gridL)" opacity="0.75"/>
  <rect width="1280" height="536" fill="url(#fadeL)"/>

  <rect x="40" y="32" width="1200" height="472" rx="14" fill="#ffffff" stroke="#d7e0ec" stroke-width="1"/>
  <rect x="40" y="32" width="1200" height="472" rx="14" fill="url(#glowL)">
    <animate attributeName="opacity" values="1;0.55;1" dur="5s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>

  <path d="M40 46 a14 14 0 0 1 14 -14 h1172 a14 14 0 0 1 14 14 v32 h-1200 z" fill="#f1f5fa"/>
  <line x1="40" y1="78" x2="1240" y2="78" stroke="#d7e0ec" stroke-width="1"/>
  <circle cx="66" cy="55" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="55" r="6" fill="#febc2e"/>
  <circle cx="106" cy="55" r="6" fill="#28c840"/>
  <text x="132" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6d7f97">~/gamaleldin11/whoami.sh</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.35s" fill="freeze"/>
    <text x="76" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
      <tspan fill="#0d9488">$</tspan><tspan fill="#4a5b73" dx="8">whoami</tspan>
    </text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.35s" fill="freeze"/>
    <text x="76" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#77879e">gamaleldin11</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.85s" dur="0.5s" fill="freeze"/>
    <text x="76" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#101828" letter-spacing="-1.2">Gamaleldin Salem</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.35s" fill="freeze"/>
    <text x="76" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#0d9488">Full-Stack .NET Engineer</text>
  </g>
  <rect x="367" y="230" width="10" height="20" fill="#0d9488" opacity="0">
    <animate attributeName="opacity" begin="1.6s" dur="1s" values="1;0;1;1" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.35s" fill="freeze"/>
    <text x="76" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
      <tspan fill="#0d9488">$</tspan><tspan fill="#4a5b73" dx="8">cat focus.txt</tspan>
    </text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
    <text x="76" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#4a5b73">I build AI-integrated financial systems — ASP.NET Core and Angular on the</text>
    <text x="76" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#4a5b73">outside, forecasting engines and LLM orchestration underneath.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.3s" fill="freeze"/>
    <rect x="76" y="366" width="126" height="30" rx="6" fill="none" stroke="#b7c6da"/>
    <circle cx="92" cy="381" r="3.5" fill="#4a5b73"/>
    <text x="104" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#4a5b73">Giza, Egypt</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
    <rect x="214" y="366" width="330" height="30" rx="6" fill="none" stroke="#b7c6da"/>
    <circle cx="230" cy="381" r="3.5" fill="#4a5b73"/>
    <text x="242" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#4a5b73">BSc ×2 · Computer Systems Engineering</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
    <rect x="556" y="366" width="212" height="30" rx="6" fill="#e6f4f2" stroke="#0d9488" stroke-opacity="0.45"/>
    <circle cx="572" cy="381" r="3.5" fill="#0d9488">
      <animate attributeName="r" begin="3s" dur="1.8s" values="3.5;4.6;3.5" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="opacity" begin="3s" dur="1.8s" values="1;0.45;1" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <text x="584" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0d9488">Open to opportunities</text>
  </g>

  <!-- capability strip -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.45s" fill="freeze"/>
    <line x1="76" y1="422" x2="1204" y2="422" stroke="#d7e0ec" stroke-width="1"/>

    <!-- Backend -->
    <g transform="translate(76,438)">
      <rect width="28" height="28" rx="6" fill="#f1f5fa" stroke="#d7e0ec"/>
      <g transform="translate(4,4)" stroke="#0d9488">
        <rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke-width="1.6"/>
        <rect x="9.5" y="9.5" width="5" height="5" rx="0.5" fill="none" stroke-width="1.6"/>
        <line x1="12" y1="1.5" x2="12" y2="4" stroke-width="1.6"/>
        <line x1="12" y1="20" x2="12" y2="22.5" stroke-width="1.6"/>
        <line x1="1.5" y1="12" x2="4" y2="12" stroke-width="1.6"/>
        <line x1="20" y1="12" x2="22.5" y2="12" stroke-width="1.6"/>
      </g>
      <text x="40" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#4a5b73">Backend</text>
    </g>

    <!-- Frontend -->
    <g transform="translate(376,438)">
      <rect width="28" height="28" rx="6" fill="#f1f5fa" stroke="#d7e0ec"/>
      <g transform="translate(4,4)" stroke="#0d9488" fill="none" stroke-width="1.6">
        <polyline points="8,6 3,12 8,18"/>
        <polyline points="16,6 21,12 16,18"/>
      </g>
      <text x="40" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#4a5b73">Frontend</text>
    </g>

    <!-- Data -->
    <g transform="translate(676,438)">
      <rect width="28" height="28" rx="6" fill="#f1f5fa" stroke="#d7e0ec"/>
      <g transform="translate(4,4)" stroke="#0d9488" fill="none" stroke-width="1.6">
        <ellipse cx="12" cy="5.5" rx="7" ry="2.5"/>
        <path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/>
        <path d="M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>
      </g>
      <text x="40" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#4a5b73">Data</text>
    </g>

    <!-- AI / ML -->
    <g transform="translate(976,438)">
      <rect width="28" height="28" rx="6" fill="#f1f5fa" stroke="#d7e0ec"/>
      <g transform="translate(4,4)" fill="#0d9488">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      </g>
      <text x="40" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#4a5b73">AI / ML</text>
    </g>
  </g>
</svg>
